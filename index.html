<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinity High School Display</title>

    <link rel="stylesheet" href="style.css">
</head>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBXrj6SEcEVl0ThXUQn2xSDw9KfxC07GlM",
  authDomain: "trinity-display-8a44c.firebaseapp.com",
  projectId: "trinity-display-8a44c",
  storageBucket: "trinity-display-8a44c.firebasestorage.app",
  messagingSenderId: "41795584168",
  appId: "1:41795584168:web:2bb0f156a6bcceb423029d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadDisplay() {

  const snap = await getDoc(
    doc(db, "display", "current")
  );

  if (!snap.exists()) {
    console.log("Document not found");
    return;
  }

  console.log(snap.data());

}

setInterval(loadDisplay,5000);
</script>
<body>

<div id="eventScreen" class="event-screen hidden">
    <img src="school-logo.png" alt="School Logo">
    <h1 id="eventTitle"></h1>
    <h2 id="eventSubtitle"></h2>
    <p id="eventMessage"></p>
</div>

<div id="mainScreen">

    <header>

        <div class="logo-section">
            <img src="school-logo.png" alt="School Logo">
            <div>
                <h1>Trinity High School</h1>
                <p>Home • School • Church</p>
            </div>
        </div>

        <div class="clock-section">
    <div id="time"></div>
    <div id="day"></div>
    <div id="date"></div>
</div>

    </header>

    <main>

        <div class="period-card">

            <div class="period-label">
                CURRENT PERIOD
            </div>

            <div id="periodName" class="period-name">
                Loading...
            </div>

            <div id="periodEnd" class="period-end">
                Loading...
            </div>

        </div>

        <div id="assemblyContainer" class="assembly hidden">
            Assembly is for:
            <span id="assemblyYear"></span>
        </div>

        <div class="notices">

            <h2>School Notices</h2>

            <ul id="noticeList">
            </ul>

        </div>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
